name: CI - Pruebas backend y build frontend

# Plan (Modulo 7 / 2.B.10): ninguna version llega a produccion sin pasar las
# pruebas. Los workflows de despliegue llaman a este workflow (workflow_call)
# y solo despliegan si termina en verde.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend - migraciones + pytest (MySQL 8 real)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_only
          MYSQL_DATABASE: appcitas
          MYSQL_USER: appcitas
          MYSQL_PASSWORD: appcitas_ci_only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_ci_only"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      vault:
        image: hashicorp/vault:1.15
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ci_root_token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
      storage:
        image: andrewgaul/s3proxy:latest
        env:
          S3PROXY_IDENTITY: ciaccesskey
          S3PROXY_CREDENTIAL: cisecretkey
          JCLOUDS_PROVIDER: transient
        ports: ["9002:80"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025"]
    env:
      ENVIRONMENT: testing
      DATABASE_URL: mysql+asyncmy://appcitas:appcitas_ci_only@127.0.0.1:3306/appcitas
      DATABASE_SYNC_URL: mysql+pymysql://appcitas:appcitas_ci_only@127.0.0.1:3306/appcitas
      REDIS_URL: redis://127.0.0.1:6379/0
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ci_root_token
      S3_ENDPOINT_URL: http://127.0.0.1:9002
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:9002
      S3_ACCESS_KEY: ciaccesskey
      S3_SECRET_KEY: cisecretkey
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar sintaxis de todo el backend
        run: python -m compileall -q app alembic tests

      - name: Aplicar migraciones y datos semilla
        run: |
          python - <<'PY'
          import asyncio
          from app.core.database import engine
          from app.db.seed import init_db_and_seed

          async def main():
              await init_db_and_seed()
              await engine.dispose()

          asyncio.run(main())
          PY

      - name: Pytest
        run: python -m pytest -q --maxfail=20

  frontend-build:
    name: Frontend - pruebas Vitest + build de produccion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm install --include=optional

      - name: Pruebas unitarias (Vitest)
        run: npx vitest run --passWithNoTests

      - name: Build de produccion
        env:
          CLIENT_API_URL: https://api.vitarecord.com
          API_URL: https://api.vitarecord.com
        run: npm run build
