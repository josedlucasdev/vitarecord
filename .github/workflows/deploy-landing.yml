name: Deploy Landing Page to Cloudflare Pages - vitarecord.com

on:
  push:
    branches:
      - main
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy Landing to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: landing/package.json

      - name: 📦 Instalar dependencias
        working-directory: landing
        run: npm install

      - name: 🏗️ Compilar Landing Astro (Static)
        working-directory: landing
        run: npm run build

      - name: 🚀 Desplegar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler pages project create vitarecord-web --production-branch=main || true
          command: pages deploy landing/dist --project-name=vitarecord-web --branch=main --commit-dirty=true
