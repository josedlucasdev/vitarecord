name: Deploy Frontend to cPanel - app.vitarecord.com

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy Frontend to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Instalar dependencias
        working-directory: frontend
        run: npm install --include=optional

      - name: 🏗️ Compilar Quasar SPA para Producción
        working-directory: frontend
        env:
          CLIENT_API_URL: https://api.vitarecord.com
          API_URL: https://api.vitarecord.com
          VITE_API_URL: https://api.vitarecord.com
        run: npm run build

      - name: 🚀 Subir por FTP a cPanel (app.vitarecord.com)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftp
          log-level: verbose
          server-dir: app.vitarecord.com/
          local-dir: ./frontend/dist/spa/
          dangerous-clean-slate: false
