name: Deploy Frontend to Cloudflare Pages - app.vitarecord.com

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: 📦 Instalar dependencias
        working-directory: frontend
        run: npm install --include=optional

      - name: 🏗️ Compilar Quasar SPA para Producción
        working-directory: frontend
        env:
          CLIENT_API_URL: https://api.vitarecord.com
          API_URL: https://api.vitarecord.com
          VITE_API_URL: https://api.vitarecord.com
        run: npm run build

      - name: 📄 Asegurar archivos _redirects y _headers de Cloudflare Pages
        run: |
          cp frontend/public/_redirects frontend/dist/spa/_redirects 2>/dev/null || echo "/* /index.html 200" > frontend/dist/spa/_redirects
          cp frontend/public/_headers frontend/dist/spa/_headers 2>/dev/null || true

      - name: 🚀 Desplegar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler pages project create vitarecord-app --production-branch=main || true
          command: pages deploy frontend/dist/spa --project-name=vitarecord-app --branch=main --commit-dirty=true
