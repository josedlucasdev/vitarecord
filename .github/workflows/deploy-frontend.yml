name: Deploy Frontend to Contabo VPS

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'nginx/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Build & Deploy Frontend to VPS
    runs-on: ubuntu-latest
    steps:
      - name: 🔐 Desplegar Frontend en VPS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "🚀 Iniciando despliegue de Frontend en Contabo VPS..."
            cd /opt/vitarecord
            git pull origin main
            docker compose build frontend gateway
            docker compose up -d frontend gateway
            docker image prune -f
            echo "✅ Frontend y Gateway actualizados con éxito en el VPS."
